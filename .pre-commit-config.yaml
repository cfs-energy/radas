default_install_hook_types: [pre-commit, commit-msg]  # one `pre-commit install` sets up both

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6  # keep in step with ruff in poetry.lock
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-ai-attribution
        name: no AI attribution trailers in commit messages
        entry: '(?i)(^co-authored-by:.*(claude|anthropic)|generated with .*claude|noreply@anthropic\.com)'
        language: pygrep
        stages: [commit-msg]
